:root[data-theme="dark"]{
  --bg:#110b19; --panel:#1a1326; --fg:#f3effa; --muted:#a79fb8; --line:#2c2339; --accent:#a893ff; --accent-fg:#110b19;
  --chip:#2a1f47; --hover:#221a30; --code-bg:#0a0610; --code-fg:#ece8f5; color-scheme:dark}
.page-h{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
h1{font:800 clamp(30px,5vw,44px)/1.05 var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}

.lead{color:var(--muted);max-width:68ch;margin:8px 0 0;text-wrap:pretty}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--accent);font-size:12px;font-weight:500}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.grid{display:grid;gap:12px}

.cards a.card{padding:16px;text-decoration:none;display:flex;flex-direction:column;gap:6px}

.codewrap{position:relative}
pre.code{margin:0;padding:16px;background:var(--code-bg);color:var(--code-fg);font:12.5px/1.6 var(--f-mono);overflow:auto;max-height:420px;tab-size:2}
.copy{position:absolute;top:8px;right:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.18)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}

td code,.mono{font:12px/1.4 var(--f-mono)}
.dot{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px}
.notes{padding:16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.notes ul{margin:0;padding-left:18px}
.notes li{margin:3px 0}
/* tokens pages */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.tools input{max-width:340px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sw-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column}
.sw-card:hover{border-color:var(--accent)}
.sw-card .c{height:64px;background-image:linear-gradient(45deg,#0000 25%,#8883 25% 50%,#0000 50% 75%,#8883 75%);background-size:12px 12px}
.sw-card .c i{display:block;height:100%}
.sw-card .i{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.sw-card b{font:500 12px/1.3 var(--f-mono);word-break:break-all}
.sw-card span{font:12px/1.3 var(--f-mono);color:var(--muted)}
.sw-card em{font-style:normal;font-size:11px;color:#b45309}
:root[data-theme="dark"] .sw-card em{color:#fbbf24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sw-card em{color:#fbbf24}}
.spec-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 20px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line)}
.spec-row .k{font:12px/1.5 var(--f-mono);color:var(--muted)}
.spec-row .k b{display:block;color:var(--fg);font-weight:500}
.spec-row .s{min-width:0;overflow-wrap:anywhere;color:var(--y-text-neutral-medium)}

.bars{display:flex;flex-direction:column;gap:6px}

.bar i{display:block;height:14px;background:var(--accent);border-radius:3px;max-width:100%}
.shapes{display:flex;flex-wrap:wrap;gap:16px}
.shape{display:flex;flex-direction:column;gap:6px;align-items:flex-start;font:12px/1.3 var(--f-mono)}
.shape .b{width:84px;height:84px;background:var(--chip);border:1px solid var(--accent)}
.shape .sh{width:120px;height:84px;background:var(--y-background-neutral-invert);border-radius:12px}
.shapebg{background:var(--y-background-neutral-invert);padding:20px;border-radius:var(--radius);border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

/* ===== Layout Storybook : sidebar 300px + zone principale (toolbar, canvas, panneau) ===== */
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--f-body);margin:0;overflow:hidden}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%;background:var(--bg)}
.sb{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
.sb-head{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sb-head b{font:800 20px/1 var(--f-display);letter-spacing:-.01em}
.sb-head i{font:500 11px/1 var(--f-body);font-style:normal;padding:3px 7px;border-radius:99px;background:var(--chip);color:var(--accent)}
.logo-sq{width:28px;height:28px;border-radius:8px;background:var(--y-background-brand-medium);color:#fff;display:grid;place-items:center;font:800 16px/1 var(--f-display)}
.sb-search{position:relative;margin:8px 16px 4px}
.sb-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sb-search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 38px 8px 34px;font-size:14px}
.sb-search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px/1 var(--f-mono);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--muted)}
.tree{flex:1;min-height:0;overflow:auto;padding:4px 10px 16px}
.tree .none{color:var(--muted);padding:12px 8px}
.fam{margin:20px 8px 6px;font:600 11px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--fg);min-height:28px}
.row:hover{background:var(--hover)}
.row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row svg{flex:none;color:var(--muted)}
.row .caret{transition:transform .12s;color:var(--muted)}
.row .caret.open{transform:rotate(90deg)}
.row .sp0{width:10px;flex:none}
.row.comp svg:not(.caret),.row.story svg{color:var(--accent)}
.row.d1{padding-left:22px}.row.d2{padding-left:38px}
.row.page{font-weight:500}
.row.todo{opacity:.42}
.row.todo svg{color:var(--muted)!important}
.row[aria-current="true"]{background:var(--accent);color:var(--accent-fg)}
.row[aria-current="true"] svg{color:var(--accent-fg)!important}
.sb-foot{display:flex;gap:8px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);cursor:pointer}
.mn{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.toolbar{position:relative;flex:none;display:flex;align-items:center;gap:2px;min-height:44px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .sp,.phead .sp{flex:1}
.ttl{font:600 14px/1 var(--f-body);padding:0 8px}
.tab{border:0;background:none;padding:0 12px;height:44px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.vsep{width:1px;height:20px;background:var(--line);margin:0 8px}
.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:32px;height:32px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);padding:0 6px;text-decoration:none;font-size:13px}
.tbtn:hover{background:var(--hover);color:var(--fg)}
.tbtn.sm{height:24px;min-width:24px;color:var(--accent)}
.zl{font:12px/1 var(--f-mono);color:var(--muted);min-width:42px;text-align:center}
[data-m]{display:none}
.pop{position:relative}
.menu{position:absolute;top:36px;left:0;z-index:30;min-width:210px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.menu button:hover{background:var(--hover)}
.menu button[aria-pressed="true"]{color:var(--accent);font-weight:500}
.sq{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);flex:none}
.sq.bg-light{background:var(--y-background-neutral-invert)}.sq.bg-dark{background:var(--y-background-neutral-default)}.sq.bg-brand{background:var(--y-background-brand-strong)}
.sq.bg-auto{background:linear-gradient(135deg,var(--y-background-neutral-invert) 50%,var(--y-background-neutral-default) 50%)}
.work{flex:1;min-height:0;display:flex;flex-direction:column}
.work.right{flex-direction:row}
.canvas{flex:1;min-height:0;min-width:0;overflow:auto;padding:24px;display:flex;transition:background-color .2s}
.canvas.bg-light,.dbox.bg-light,.mxw .cell.bg-light{background:var(--y-background-neutral-invert)}
.canvas.bg-dark,.dbox.bg-dark,.mxw .cell.bg-dark{background:var(--y-background-neutral-default)}
.canvas.bg-brand{background:var(--y-background-brand-strong)}
.fit{flex:none;min-width:100%;margin:auto 0;display:flex}
.fit-in{margin:0 auto;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:none}
.demo-bd{padding:32px 24px;background:radial-gradient(circle at 18% 55%,var(--y-background-brand-light),transparent 38%),radial-gradient(circle at 82% 25%,var(--y-background-brand-secondary-medium),transparent 34%),radial-gradient(circle at 60% 90%,var(--y-background-accent-light),transparent 30%)}
.panel{position:relative;flex:none;height:var(--ph,300px);display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel);min-width:0}
.work.right .panel{height:auto;width:var(--pw,380px);border-top:0;border-left:1px solid var(--line)}
.rz{position:absolute;z-index:5;top:-4px;left:0;right:0;height:8px;cursor:row-resize;touch-action:none}
.work.right .rz{top:0;bottom:0;left:-4px;right:auto;width:8px;height:auto;cursor:col-resize}
.rz:hover{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.phead{flex:none;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);min-height:40px;overflow-x:auto}
.ptabs{display:flex}
.ptabs button,.tabbar button{border:0;background:none;padding:0 12px;height:40px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
.ptabs button[aria-selected="true"],.tabbar button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabbar{display:flex;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto}
.pbody{flex:1;min-height:0;overflow:auto}
.docs{flex:1;min-height:0;overflow:auto;padding:28px 32px 64px;min-width:0}
.docs>*{max-width:1100px}
/* table des contrôles */
.ctable{min-width:560px}
.ctable th{font-weight:600;color:var(--fg);font-size:13px;padding:10px 16px;white-space:nowrap}
.ctable th.rs{display:flex;align-items:center;gap:6px}
.ctable td{padding:12px 16px;vertical-align:top;border-bottom:1px solid var(--line)}
.ctable td.n b{font-weight:600}
.ctable td.d{font-size:12.5px;color:var(--muted);min-width:180px}
.ctable td.d .tp{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ctable code{font:12px/1.4 var(--f-mono);background:var(--hover);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--fg);display:inline-block}
.ctable td.df{white-space:nowrap}
.ctable td.cc{min-width:190px}
.ctable td.cc input[type=text],.ctable td.cc select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;font-size:13.5px}
.rad{display:inline-flex;flex-wrap:wrap;gap:6px 12px}
.rad button{border:0;background:none;padding:2px 0 2px 20px;cursor:pointer;font-size:13.5px;position:relative}
.rad button::before{content:"";position:absolute;left:0;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;border:1.5px solid var(--muted)}
.rad button[aria-pressed="true"]::before{border-color:var(--accent);background:radial-gradient(var(--accent) 0 45%,transparent 50%)}
.tg{position:relative;width:38px;height:22px;border-radius:99px;border:1px solid var(--line);background:var(--hover);cursor:pointer;padding:0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}

    <p class="cv-warn" id="cvwarn" ${CV.warn?'':'hidden'}>${esc(CV.warn)}</p>
    <div class="cv-cut"><button type="button" class="y-btn y-btn--secondary y-btn--sm" id="cvcut" ${!CV.orig||CV.pre||CV.cutDone?'hidden':''}>${ic('MagicWand',18)}<span>Détourer automatiquement</span></button>
     <button type="button" class="cv-link" id="cvuncut" ${CV.cutDone?'':'hidden'}>Revenir à la photo d’origine</button><span class="cv-hint" id="cvcutst" aria-live="polite"></span></div>
    <label class="cv-f"><span>Zoom</span><input id="cvzoom" type="range" min="50" max="220" value="${Math.round(CV.zoom*100)}"></label>
    <div class="cv-inline"><label class="cv-check"><input id="cvbw" type="checkbox" ${CV.bw?'checked':''}> Noir et blanc</label><button type="button" class="cv-link" id="cvrecenter">Recentrer</button><button type="button" class="cv-link" id="cvreset">Tout réinitialiser</button></div>
    <details class="cv-tips"><summary>Conseils photo</summary><ul>
   <li><b>Détourage :</b> le bouton « Détourer automatiquement » marche bien sur un buste avec un fond uni. Sur des cheveux volumineux, le contour reste approximatif : dans ce cas, détoure sur Mac (clic droit, Actions rapides, Supprimer l’arrière-plan) ou avec remove.bg.</li>
   <li><b>Photo idéale :</b> buste cadré à la taille, fond retiré, au moins 1000 px de haut.</li>
   <li>Les textes et réglages sont mémorisés dans ce navigateur. La photo ne quitte jamais ton ordinateur.</li></ul></details>
   </form>
   <div class="cv-stage">
    <div class="cv-canvas" id="cvwrap"><canvas id="cvc" aria-label="Aperçu de la cover"></canvas></div>
    <p class="cv-hint">Glisse la photo pour la recadrer, utilise le curseur Zoom pour l’agrandir.</p>
    <div class="cv-actions"><button type="button" class="y-btn y-btn--primary y-btn--md" id="cvexport">${ic('DownloadSimple')}<span>Exporter en PNG</span></button>
     <label class="cv-check"><input id="cvhd" type="checkbox" checked> Haute définition (1600 px)</label></div>
   </div>
  </div>
  </div>`;
  const cvFitTop=()=>{const g=$('.cv-grid');if(g)g.style.setProperty('--cv-top',Math.round(g.getBoundingClientRect().top+window.scrollY)+'px')};cvFitTop();addEventListener('resize',cvFitTop);
  cvCanvas=$('#cvc');
  const bind=(id,k)=>{$('#'+id).addEventListener('input',e=>{CV[k]=e.target.value;cvSave();cvDraw()})};
  bind('cvnom','nom');bind('cvjob','job');bind('cvco','company');bind('cvtitre','titre');
  $('#cvzoom').addEventListener('input',e=>{CV.zoom=e.target.value/100;cvDraw()});
  $('#cvbw').addEventListener('change',e=>{CV.bw=e.target.checked;cvSave();if(CV.raw&&!CV.pre)CV.photo=cvProcess(CV.raw,CV.bw);cvDraw()});
  $('#cvcut').onclick=cvDoCut;
  $('#cvuncut').onclick=()=>{CV.raw=CV.orig;CV.cutDone=false;CV.photo=cvProcess(CV.orig,CV.bw);CV.warn=cvHasAlpha(CV.orig)?'':'Cette photo n’a pas de fond transparent : le fond apparaîtra sur la cover. Détoure-la d’abord.';const w=$('#cvwarn');w.textContent=CV.warn;w.hidden=!CV.warn;cvCutUI();cvDraw()};
  $('#cvrecenter').onclick=()=>{CV.zoom=1;CV.dx=0;CV.dy=0;$('#cvzoom').value=100;cvDraw()};
  $('#cvreset').onclick=async()=>{Object.assign(CV,CV_DEF);cvSave();CV.raw=null;CV.orig=null;CV.photo=null;CV.cutDone=false;CV.warn='';pageCovers()};
  const file=$('#cvfile'),drop=$('#cvdrop');
  const take=fl=>{const f0=fl&&fl[0];if(!f0)return;if(!/^image\//.test(f0.type)){toast('Format non pris en charge');return}const u=URL.createObjectURL(f0);cvSetPhoto(u,false)};
  file.addEventListener('change',()=>take(file.files));
  [drop,$('#cvwrap')].forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',()=>el.classList.remove('over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');take(e.dataTransfer.files)})});
  /* recadrage à la souris / au doigt */
  let drag=null;const k=()=>800/cvCanvas.getBoundingClientRect().width;
  cvCanvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,dx:CV.dx,dy:CV.dy};cvCanvas.setPointerCapture(e.pointerId);cvCanvas.classList.add('grab')});
  cvCanvas.addEventListener('pointermove',e=>{if(!drag)return;CV.dx=drag.dx+(e.clientX-drag.x)*k();CV.dy=drag.dy+(e.clientY-drag.y)*k();cvDraw()});
  const up=()=>{drag=null;cvCanvas.classList.remove('grab')};cvCanvas.addEventListener('pointerup',up);cvCanvas.addEventListener('pointercancel',up);
  $('#cvexport').onclick=async()=>{const b=$('#cvexport');b.disabled=true;
    try{const c=document.createElement('canvas');cvRender(c,$('#cvhd').checked?2:1);
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));const n='pause-produit-'+(slug((CV.nom||'cover').normalize('NFD').replace(/[̀-ͯ]/g,''))||'cover')+'.png';
      await saveFile(n,blob)}catch(e){toast('Export impossible')}finally{b.disabled=false}};
  cvBoot();
}

const main=document.getElementById('main');
document.documentElement.setAttribute('data-theme','light');
pageCovers();
</script></body></html>
