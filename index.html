function pretty(html){

  html.replace(/>\s*</g,'>\n<').split('\n').forEach(l=>{

}

const hit=(s,q)=>!q||s.toLowerCase().includes(q);
function row(cls,act,k,depth,inner,cur,extra=''){return `<button type="button" class="row d${depth} ${cls}" data-act="${act}" data-k="${k}"${cur?' aria-current="true"':''}${extra}>${inner}</button>`}
function currentPath(){ // clés à déplier pour la sélection courante
  const s=new Set(), h=(location.hash||'').slice(1).split('--')[0];
  TREE.forEach(f=>f.items.forEach(it=>{
    if(it.docs&&it.docs.some(d=>d[0]===h)) s.add(it.key);
    (it.cs||[]).forEach(x=>{if(x.id===h){s.add(it.key); if(it.cs.length>1) s.add('c:'+x.id)}});
    if(it.todo&&('todo-'+slug(it.page))===h) s.add(it.key);
  }));
  return s;
}
function renderTree(reveal){
  const q=SEARCH.trim().toLowerCase(), hash=(location.hash||'').slice(1), [hc,hs]=hash.split('--'), path=currentPath();
  let html=row('home','nav','intro',0,`${I.doc}<span>Accueil</span>`,!hash||hash==='intro');
  TREE.forEach(f=>{
    let fh='';
    f.items.forEach(it=>{
      if(it.todo){ if((!SHOWTODO&&!it.hot)||!hit(it.page,q)) return; const id='todo-'+slug(it.page); fh+=row(it.hot?'':'todo','nav',id,0,`<i class="sp0"></i>${I.folder}<span>${esc(it.page)}${it.hot?' <em style="font-style:normal;font-size:11px;opacity:.7">(bêta)</em>':''}</span>`,hc===id); return }
      if(it.docs){
        const kids=it.docs.filter(d=>hit(d[1],q)||hit(it.page,q)); if(!kids.length) return;
        const open=q||((EXP.has(it.key)||path.has(it.key))&&!COLL.has(it.key));
        fh+=row('page','tog',it.key,0,`${I.caret.replace('class="caret"','class="caret'+(open?' open':'')+'"')}${I.folder}<span>${it.page}</span>`);
        if(open) fh+=kids.map(d=>row('doc','nav',d[0],1,`${I.doc}<span>${d[1]}</span>`,hc===d[0])).join('');
        return;
      }
      let cs=it.cs.filter(x=>x.c||SHOWTODO);
      if(!cs.length) return;
      const pageHit=hit(it.page,q);
      const match=cs.filter(x=>pageHit||hit(x.n,q)||(x.c&&STORIES[x.c.id].some(s=>hit(s.n,q))));
      if(!match.length) return;
      const open=q||((EXP.has(it.key)||path.has(it.key))&&!COLL.has(it.key));
      const allTodo=cs.every(x=>!x.c);
      fh+=row('page'+(allTodo?' todo':''),'tog',it.key,0,`${I.caret.replace('class="caret"','class="caret'+(open?' open':'')+'"')}${I.folder}<span>${esc(it.page)}</span>`);
      if(!open) return;
      const single=it.cs.length===1&&it.cs[0].c;
      match.forEach(x=>{
        if(!x.c){ fh+=row('todo','nav',x.id,1,`<i class="sp0"></i>${I.comp}<span>${esc(x.n)}</span>`,hc===x.id); return }
        const stories=STORIES[x.c.id];
        if(single){ fh+=stories.map(s=>row('story','nav',x.id+'--'+s.id,1,`<i class="sp0"></i>${I.story}<span>${s.n}</span>`,hc===x.id&&hs===s.id)).join(''); return }
        const copen=q||((EXP.has('c:'+x.id)||path.has('c:'+x.id))&&!COLL.has('c:'+x.id));
        fh+=row('comp','togc','c:'+x.id,1,`${I.caret.replace('class="caret"','class="caret'+(copen?' open':'')+'"')}${I.comp}<span>${esc(x.n)}</span>`);
        if(copen) fh+=stories.map(s=>row('story','nav',x.id+'--'+s.id,2,`<i class="sp0"></i>${I.story}<span>${s.n}</span>`,hc===x.id&&hs===s.id)).join('');
      });
    });
    if(fh) html+=`<div class="fam">${f.fam}</div>`+fh;
  });
  $('#tree').innerHTML=html||'<p class="none">Aucun résultat.</p>';

}

}

 image:['Images placeholder','retouche','Les exports Figma expirent après 7 jours : prévoir de vraies images en prod.'],
 doc:['Non documenté','retouche','Pas de description dans Figma : remplir le template de documentation.'],
 ids:['Identifiants en double','retouche','Préfixer les identifiants SVG par instance, sinon deux copies sur une page se marchent dessus.'],
 aria:['Icônes non masquées','retouche','Ajouter aria-hidden="true" aux icônes décoratives.'],
 depasse:['Léger dépassement','retouche','Dépassement décoratif de quelques pixels : à vérifier en intégration.']};
const AU_PROD=[
 ['Les cartes clients pivotent au survol','.card-client:hover { transform: rotate(2deg) } avec transition transform .25s. Le survol change aussi deux éléments internes : le libellé du bouton s’élargit et le nom de l’auteur disparaît.','Aucune variante Hover du DS ne décrit cette rotation.'],
 ['L’icône d’expertise pivote et s’ombre','.exp_item:hover .exp_icon { transform: rotate(-15deg) } plus une ombre portée colorée. La couleur tourne selon la position : nth-child(4n+1) violet, 4n+2 rose, 4n+3 jaune, 4n+4 vert.','Le DS documente une variante Hover, sans la rotation ni le cycle de couleurs.'],
 ['Le bouton a une pastille qui glisse','Un bloc .button_hover en position absolue glisse de la droite (right: -10%) en 0,5 s, pendant que la bordure change en 0,2 s.','Le DS ne décrit qu’un changement de couleur.'],
 ['Les espacements suivent la largeur de l’écran','Sous 1440px, html { font-size: calc(0.625rem + 0.416667vw) } : tout le site est en rem, donc tous les espacements et toutes les tailles de texte rétrécissent progressivement.','Le DS est en pixels fixes : un composant repris tel quel ne suivra pas cette respiration.'],
 ['Les points de rupture ne sont pas les mêmes','Le site bascule à 991px, 767px et 479px (standard Webflow).','Le DS ne prévoit que Desktop et Mobile, sans valeur de bascule.'],
 ['Le site de prod est moins accessible que le DS','Les boutons sont des div (curseur par défaut, non focalisables) avec un lien invisible par-dessus, et Webflow met outline:0 sur la plupart des éléments.','Les composants faits main du Yeitibook utilisent button, a, input et un focus visible : les reprendre améliorerait la prod.']];
function pageAudit(){
  const n=v=>AUDIT.filter(r=>r.v===v).length;
  const chip=(c)=>{const k=AU_DEF[c];return k?`<span class="au-chip au-${k[1]}" data-c="${c}">${k[0]}</span>`:''};
  const rows=AUDIT.map((r,i)=>`<tr class="au-row" data-v="${r.v}" data-codes="${r.d.map(x=>x[0]).join(' ')}">
    <td><span class="au-dot au-${r.v}" title="${r.v}"></span></td>
    <td class="au-n"><button type="button" class="au-name" data-i="${i}">${esc(r.n)}</button><small>${r.g?'généré depuis Figma':'fait main'} · ${r.w}px de large</small></td>
    <td class="au-c">${r.d.map(x=>chip(x[0])).join('')}</td>
    <td class="au-a">${r.g?'':'<a href="#'+r.id+'">voir</a>'}${r.g?'<a href="#'+r.id+'">voir</a>':''}</td></tr>
    <tr class="au-det" id="au-d-${i}" hidden><td></td><td colspan="3"><ul>${r.d.map(([c,t])=>{const L=AU_DEF[c]?AU_DEF[c][0]:c;let x=t;const pre=L+' : ';if(x.indexOf(pre)===0)x=x.slice(pre.length);return `<li><b>${L}</b> · ${esc(x)}<br><em>${AU_DEF[c]?esc(AU_DEF[c][2]):''}</em></li>`}).join('')}</ul></td></tr>`).join('');
  const counts={};AUDIT.forEach(r=>r.d.forEach(([c])=>counts[c]=(counts[c]||0)+1));
  const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  main.innerHTML=`<div class="au">
  <div class="page-h"><h1>Prêt pour la prod ?</h1><div class="meta"><span class="pill">Audit</span><span>74 composants testés</span></div></div>
  <p class="lead">Chaque composant a été rendu dans un navigateur, puis mesuré : texte coupé, décor qui sort du cadre, contraste, sémantique HTML, comportement à 360px de large. Les défauts ci-dessous sont mesurés, pas estimés.</p>
  <div class="au-tiles">
   <button type="button" class="au-tile au-t-ok" data-f="ok"><b>${n('ok')}</b><span>Prêts à reprendre</span><small>Code sémantique, focus clavier, survol en CSS.</small></button>
   <button type="button" class="au-tile au-t-ret" data-f="retouche"><b>${n('retouche')}</b><span>À réécrire pour la prod</span><small>Le rendu est juste, le code est une référence Figma, pas du code de production.</small></button>
   <button type="button" class="au-tile au-t-blo" data-f="bloquant"><b>${n('bloquant')}</b><span>À corriger dans Figma d’abord</span><small>Texte coupé ou invisible, décor qui déborde : le défaut vient de la maquette.</small></button>
  </div>
  <div class="card au-verdict"><h2>Le verdict en une phrase</h2>
   <p>Les <b>5 composants faits main</b> (bouton, lien, tag, champ, en-tête) sont directement reprenables en prod. Les <b>66 composants générés depuis Figma</b> ne le sont pas : ils portent <b>${Math.round(AUDIT.filter(r=>r.g).reduce((a,r)=>a+r.inl/r.nd,0)/AUDIT.filter(r=>r.g).length*100)}% de styles en ligne</b>, des hauteurs figées et des positions absolues. Ils servent de référence fidèle à la maquette, et c’est à ce titre qu’ils sont utiles : ils révèlent <b>${AUDIT.filter(r=>r.v==='bloquant').length} défauts bloquants qui existent dans Figma</b>, pas dans le code.</p></div>
  <h2>Ce que le site de prod fait, et que le DS ne dit pas</h2>
  <p class="au-sub">Relevé directement dans le CSS de yeita.fr. Tout y est en CSS pur : aucune animation Webflow, donc tout est transposable dans le DS.</p>
  <div class="au-prod">${AU_PROD.map(([t,w,g])=>`<div class="card au-p"><h3>${t}</h3><p>${w}</p><p class="au-gap">${g}</p></div>`).join('')}</div>
  <h2>Défauts par fréquence</h2>
  <div class="au-bars">${top.map(([c,v])=>`<button type="button" class="au-bar" data-f2="${c}"><span class="au-bl">${AU_DEF[c]?AU_DEF[c][0]:c}</span><span class="au-bt"><i style="width:${Math.round(v/74*100)}%"></i></span><span class="au-bv">${v}</span></button>`).join('')}</div>
  <h2>Composant par composant</h2>
  <div class="au-filters"><button type="button" class="au-f on" data-f="">Tous (74)</button><button type="button" class="au-f" data-f="bloquant">Bloquants (${n('bloquant')})</button><button type="button" class="au-f" data-f="retouche">À réécrire (${n('retouche')})</button><button type="button" class="au-f" data-f="ok">Prêts (${n('ok')})</button><span class="au-clear" id="auclear" hidden></span></div>
  <div class="card au-tablewrap"><table class="au-table"><thead><tr><th></th><th>Composant</th><th>Défauts mesurés</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <h2>Comment lire cet audit</h2>
  <div class="card notes"><ul>
   <li><b>Ce qui a été mesuré :</b> rendu réel dans Chromium à 1500px, puis à 360px. Texte coupé = le contenu dépasse la boîte qui le coupe. Décor hors cadre = un bloc sort du composant sans être coupé par un parent. Contraste = calcul WCAG entre la couleur du texte et le fond effectif.</li>
   <li><b>Ce qui n’a pas été mesuré :</b> le comportement au clavier bout à bout, la lecture par un vrai lecteur d’écran, et le rendu sur navigateurs anciens.</li>
   <li><b>Limite connue du Yeitibook :</b> l’extracteur ne lit pas les rotations de Figma. Un élément incliné dans la maquette s’affiche droit ici, ce qui explique une partie des décors mal placés.</li>
   <li><b>« À réécrire » ne veut pas dire « raté » :</b> le HTML généré est une photographie du fichier Figma. Pour la prod, il faut le traduire en classes CSS avec les tokens, ce que font déjà les 5 composants faits main.</li></ul></div></div>`;
  const tb=$('.au-table');
  let fv='',fc='';
  const apply=()=>{$$('.au-row').forEach(r=>{const okv=!fv||r.dataset.v===fv,okc=!fc||r.dataset.codes.split(' ').includes(fc);
    const show=okv&&okc;r.hidden=!show;const det=r.nextElementSibling;if(det&&det.classList.contains('au-det')&&!show)det.hidden=true});
   $$('.au-f').forEach(b=>b.classList.toggle('on',b.dataset.f===fv));
   const c=$('#auclear');c.hidden=!(fv||fc);c.textContent=fc?'Filtre : '+(AU_DEF[fc]?AU_DEF[fc][0]:fc)+' ✕':'';};
  $$('.au-f').forEach(b=>b.onclick=()=>{fv=b.dataset.f;apply()});
  $$('.au-tile').forEach(b=>b.onclick=()=>{fv=b.dataset.f;fc='';apply();$('.au-table').scrollIntoView({behavior:'smooth',block:'start'})});
  $$('.au-bar').forEach(b=>b.onclick=()=>{fc=fc===b.dataset.f2?'':b.dataset.f2;apply();$('.au-table').scrollIntoView({behavior:'smooth',block:'start'})});
  $('#auclear').onclick=()=>{fc='';fv='';apply()};
  tb.addEventListener('click',e=>{const b=e.target.closest('.au-name');if(!b)return;const d=$('#au-d-'+b.dataset.i);d.hidden=!d.hidden;b.classList.toggle('open',!d.hidden)});
  tb.addEventListener('click',e=>{const c=e.target.closest('.au-chip');if(!c)return;fc=c.dataset.c;apply()});
}
function pageCovers(){location.href='covers/'}
function pageTodo(id){
  if(id==='todo-sandbox-covers'){pageCovers();return}
  const t=TODO[id]||{name:id,page:'',fam:''};
  main.innerHTML=`<div class="page-h"><h1>${esc(t.name)}</h1><div class="meta"><span class="pill warn">À venir</span><span>${esc(t.fam)}${t.page?' / '+esc(t.page):''}</span></div></div>
  <p class="lead">Cet élément existe dans Figma mais n’est pas encore reconstruit dans le Yeitibook. Il apparaît dans l’arbre pour conserver l’organisation du fichier.</p>
  <p><a class="pill" href="${FIGMA.split('?')[0]}" target="_blank" rel="noopener">Ouvrir le fichier Figma ↗</a></p>`;
}
function docsPage(c){
  const host=$('#doc'), p=STATE[c.id];
  host.innerHTML=`<div class="page-h"><h1>${c.name}</h1></div><p class="lead">${esc(c.desc)}</p>
  <h2>Aperçu</h2><div class="dbox bg-light" id="dprev"><div class="fit" data-w="0"><div class="fit-in"></div></div></div>
  <h2>Propriétés</h2><div class="card" id="dctl"></div>
  <h2>Stories</h2><div class="dstories">${STORIES[c.id].map(s=>`<div><div class="dst"><h3>${s.n}</h3><a href="#${c.id}--${s.id}">Ouvrir dans Canvas</a></div><div class="dbox bg-light" data-s="${s.id}"><div class="fit" data-w="0"><div class="fit-in"></div></div></div></div>`).join('')}</div>
  ${c.mx?`<h2>Toutes les variantes</h2><div class="card" id="dmx"></div>`:''}
  <h2>Code</h2><div class="card"><div class="tabbar" id="dtb"></div><div id="dcode"></div></div>
  <h2>Tokens utilisés</h2><div class="card">${tokensTable(c)}</div>
  <h2>Notes et écarts</h2><div class="card">${notesHTML(c)}</div>`;
  const draw=()=>{
    const cur=STATE[c.id], f=$('#dprev .fit');
    $('.fit-in',f).innerHTML=c.wrap?c.wrap(R[c.id](cur)):R[c.id](cur); gInteract($('.fit-in',f),c,()=>STATE[c.id]); f.dataset.w=c.w?c.w(cur):0;
    $('#dprev').className='dbox bg-'+((BG[c.id]||'auto')==='auto'?autoBg(c,cur):BG[c.id]);
    applyFit(); if(c.mx) $('#dmx').innerHTML=matrixHTML(c); drawDocCode();
  };
  let dt='html'; const tabs=[['html','HTML'],['css','CSS']];
  const drawDocCode=()=>{
    $('#dtb').innerHTML=tabs.map(([k,l])=>`<button type="button" role="tab" data-k="${k}" aria-selected="${dt===k}">${l}</button>`).join('');
    $$('#dtb button').forEach(b=>b.onclick=()=>{dt=b.dataset.k;drawDocCode()});
    const txt=dt==='html'?pretty(R[c.id](STATE[c.id])):(c.gen?GEN_CSS_NOTE:cssFor(c.css)), d=$('#dcode');
    d.innerHTML=codeBlock(); $('pre',d).textContent=txt; $('.copy',d).onclick=()=>copy(txt);
  };
  STORIES[c.id].forEach(s=>{
    const box=$(`.dbox[data-s="${s.id}"]`,host), q={...defaults(c),...s.a}, f=$('.fit',box);
    $('.fit-in',f).innerHTML=c.wrap?c.wrap(R[c.id](q)):R[c.id](q); gInteract($('.fit-in',f),c,()=>q); f.dataset.w=c.w?c.w(q):0; box.className='dbox bg-'+autoBg(c,q);
  });
  controlsTable(c,$('#dctl'),draw); draw(); applyFit();
  ro.disconnect(); ro.observe(host);
}
function panelHTML(c){
  return `<section class="panel" id="panel"><div class="rz" id="rz" title="Redimensionner"></div><div class="phead"><div class="ptabs" role="tablist">${[['controls','Controls'],['html','HTML'],['css','CSS'],['tok','Tokens'],['notes','Notes']].map(([k,l])=>`<button type="button" role="tab" data-k="${k}" aria-selected="${PTAB===k}">${l}</button>`).join('')}</div><span class="sp"></span>${tbtn('ppos',I.pos,'Panneau à droite / en bas')}${tbtn('pclose',I.x,'Fermer le panneau')}</div><div class="pbody" id="pbody"></div></section>`;
}
function pageComponent(c,story){
  const mn=$('#mn');
  mn.innerHTML=toolbar(c)+(VIEW==='docs'?`<div class="docs" id="doc"></div>`:`<div class="work ${PPOS==='right'?'right':''}"><div class="canvas bg-light" id="canvas"><div class="fit" id="fit"><div class="fit-in" id="fitin"></div></div></div>${PCLOSED?'':panelHTML(c)}</div>`);
  bindToolbar(c);
  if(VIEW==='docs'){docsPage(c);return}
  const drawPane=(full)=>{
    const body=$('#pbody'); if(!body) return;
    if(PTAB==='controls'){ if(full) controlsTable(c,body,update) }
    else if(PTAB==='html'||PTAB==='css'){const txt=PTAB==='html'?pretty(R[c.id](STATE[c.id])):(c.gen?GEN_CSS_NOTE:cssFor(c.css));body.innerHTML=codeBlock();$('pre',body).textContent=txt;$('.copy',body).onclick=()=>copy(txt)}
    else if(PTAB==='tok') body.innerHTML=tokensTable(c);
    else body.innerHTML=notesHTML(c);
  };
  function update(){
    const cur=STATE[c.id], fit=$('#fit');
    $('#fitin').innerHTML=c.wrap?c.wrap(R[c.id](cur)):R[c.id](cur); gInteract($('#fitin'),c,()=>STATE[c.id]);
    fit.dataset.w=c.w?c.w(cur):0; setBg(c); applyFit(); if(PTAB!=='controls') drawPane(false);
  }
  if(!PCLOSED){
    $$('.ptabs button').forEach(b=>b.onclick=()=>{PTAB=b.dataset.k;$$('.ptabs button').forEach(z=>z.setAttribute('aria-selected',z===b));drawPane(true)});
    $('#pclose').onclick=()=>{PCLOSED=true;route()};
    $('#ppos').onclick=()=>{PPOS=PPOS==='bottom'?'right':'bottom';route()};
    const panel=$('#panel');
    if(PPOS==='right') panel.style.setProperty('--pw',PW+'px'); else panel.style.setProperty('--ph',PH+'px');
    $('#rz').onpointerdown=e=>{
      e.preventDefault(); const rz=e.currentTarget; rz.setPointerCapture(e.pointerId); const r=$('.work').getBoundingClientRect();
      const mv=ev=>{if(PPOS==='right'){PW=Math.max(260,Math.min(r.width-240,r.right-ev.clientX));panel.style.setProperty('--pw',PW+'px')}else{PH=Math.max(120,Math.min(r.height-160,r.bottom-ev.clientY));panel.style.setProperty('--ph',PH+'px')}applyFit()};
      const up=()=>{rz.removeEventListener('pointermove',mv);rz.removeEventListener('pointerup',up)};
      rz.addEventListener('pointermove',mv);rz.addEventListener('pointerup',up);
    };
  }
  update(); drawPane(true);
  ro.disconnect(); ro.observe($('#canvas'));
}

/* ---------- routeur ---------- */
function route(){
  const h=(location.hash||'').slice(1), [cid,sid]=h.split('--');
  const mn=$('#mn'); $('#app').classList.remove('open'); ro.disconnect();
  if(cid&&BYID[cid]&&!sid){location.replace('#'+cid+'--'+STORIES[cid][0].id);return}
  COLL.clear();renderTree(true);
  if(cid&&BYID[cid]){
    const c=BYID[cid], st=STORIES[cid].find(s=>s.id===sid)||STORIES[cid][0], key=cid+'--'+st.id;
    if(LOADED!==key){STATE[cid]={...defaults(c),...st.a};LOADED=key;Z=1}
    pageComponent(c,st); return;
  }
  LOADED=''; Z=1;
  const titles={'tokens-couleurs':'Tokens / Couleurs','tokens-typo':'Tokens / Typographie','tokens-formes':'Tokens / Espacements et formes','icons':'Icons / V2.Icons.Library','audit-prod':'Qualité / Prêt pour la prod ?'}, known=Object.keys(titles);
  const id=cid||'intro';
  mn.innerHTML=toolbar(null,known.includes(id)?titles[id]:TODO[id]?TODO[id].name:'Accueil')+'<div class="docs" id="doc"></div>';
  bindToolbar(null); main=$('#doc');
  if(id==='tokens-couleurs') pageColors(); else if(id==='tokens-typo') pageType(); else if(id==='tokens-formes') pageShapes(); else if(id==='icons') pageIcons(); else if(id==='audit-prod') pageAudit();
  else if(TODO[id]) pageTodo(id); else pageIntro();
  main.parentElement.scrollTop=0;
}
document.addEventListener('click',e=>{const a=e.target.closest('.canvas a, .dbox a, .cell a, .y-footer a');if(a&&a.getAttribute('href')==='#')e.preventDefault()},true);
$('#tree').addEventListener('click',e=>{
  const b=e.target.closest('.row'); if(!b) return; const k=b.dataset.k, act=b.dataset.act;
  if(act==='tog'||act==='togc'){const isOpen=(EXP.has(k)||currentPath().has(k))&&!COLL.has(k);if(isOpen){EXP.delete(k);COLL.add(k)}else{EXP.add(k);COLL.delete(k)}renderTree()}
  else if(act==='nav'||act==='home'){ if(location.hash==='#'+k) route(); else location.hash=k }
});
$('#q').addEventListener('input',e=>{SEARCH=e.target.value;renderTree()});
$('#showtodo').addEventListener('change',e=>{SHOWTODO=e.target.checked;renderTree()});
$('#scrim').addEventListener('click',()=>$('#app').classList.remove('open'));
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
  else if(e.key==='Escape'&&document.activeElement===$('#q')){$('#q').value='';SEARCH='';renderTree();$('#q').blur()}
});
addEventListener('hashchange',route);
addEventListener('resize',applyFit);
root.setAttribute('data-theme','light');
route();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(applyFit);
})();
